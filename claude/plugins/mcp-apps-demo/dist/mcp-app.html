<body>
  <main class="app" id="app">
    <!-- Shown when a newer copy of this app opened further down the chat -->
    <p class="superseded-note" id="superseded-note" hidden>A newer version of this is below ↓</p>

    <header class="header">
      <div class="brand">
        <span class="logo" data-icon="sun"></span>
        <div>
          <h1 id="title">Solar jobs</h1>
          <p class="muted small" id="subtitle">Formbay demo data</p>
        </div>
      </div>
      <button class="icon-btn" id="fullscreen-btn" title="Full screen" hidden><span data-icon="expand"></span></button>
    </header>

    <p class="error" id="error" hidden></p>

    <!-- ================= Dashboard (tool: show_solar_dashboard) ================= -->
    <section id="dashboard" hidden>
      <div class="filters">
        <div class="chips" id="state-chips" role="group" aria-label="State"></div>
        <div class="chips" id="installer-chips" role="group" aria-label="Installer"></div>
      </div>

      <div id="empty" class="empty" hidden></div>

      <div id="results">
        <div class="tiles" id="tiles">
          <div class="tile skeleton"></div><div class="tile skeleton"></div><div class="tile skeleton"></div><div class="tile skeleton"></div>
        </div>

        <figure class="chart">
          <figcaption class="muted small">STCs per month</figcaption>
          <svg id="chart" role="img" aria-label="STCs per month"></svg>
        </figure>

        <table>
          <thead><tr><th>Job</th><th>Customer</th><th>Location</th><th>Installer</th><th class="num">kW</th><th class="num">STCs</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>

        <div class="selection">
          <p id="selection-text" class="muted small">Click a job to select it. Claude will know which one you picked.</p>
          <button id="ask-btn" disabled><span data-icon="chat"></span>Ask Claude about this job</button>
        </div>
      </div>

      <details class="supports">
        <summary>What this Claude supports</summary>
        <ul id="supports-list"></ul>
      </details>
    </section>

    <!-- ================= New job form (tool: draft_solar_job) ================= -->
    <section id="form-view" hidden>
      <p class="hint" id="form-hint">Fill in the details, then press Submit.</p>
      <form id="job-form" class="form" novalidate>
        <label>Customer <input name="customer" placeholder="e.g. Priya Sharma" autocomplete="off"></label>
        <label>Suburb <input name="suburb" placeholder="e.g. Bondi" autocomplete="off"></label>
        <label>State
          <select name="region"><option value="">Choose…</option><option>NSW</option><option>VIC</option><option>QLD</option><option>SA</option><option>WA</option></select>
        </label>
        <label>Size (kW) <input name="systemKw" type="number" step="0.1" min="0.1" max="100" placeholder="e.g. 6.6"></label>
        <label>Installer
          <select name="installer"><option value="">Not assigned</option></select>
        </label>
        <label class="wide">Notes <textarea name="notes" rows="2"></textarea></label>
        <p class="wide muted small" id="estimate"></p>
        <div class="wide">
          <button type="submit" id="submit-btn"><span data-icon="check"></span>Submit job</button>
        </div>
      </form>
      <p class="success" id="form-success" hidden></p>
    </section>
  </main>
</body>
</html>
